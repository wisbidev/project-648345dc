services:
  frontend:
    build:
      context: .
      dockerfile: code/frontend/Dockerfile
    container_name: landing-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
